appId: com.redis-manager.app
productName: Redis Manager
directories:
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!shared/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc,.editorconfig}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{tailwind.config.js,postcss.config.js}'
win:
  executableName: redis-manager
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: Redis Manager
  uninstallDisplayName: Redis Manager
mac:
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
linux:
  target:
    - AppImage
  maintainer: redis-manager
  category: Development
